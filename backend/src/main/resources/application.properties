# Application name
spring.application.name=backend

# Active profile — defaults to 'dev' locally, override with SPRING_PROFILES_ACTIVE=prod on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port — Render injects PORT; fallback to 8080 for local dev
server.port=${PORT:8080}

# Datasource — all values injected via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Supabase JWT secret
supabase.jwt.secret=${JWT_SECRET}

# Gemini API key
gemini.api.key=${GEMINI_API_KEY}

# FRONTEND_URL — used by CorsConfig
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Actuator — expose only health and info; never expose env, beans, mappings etc.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true