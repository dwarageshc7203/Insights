# Application name
spring.application.name=backend

# Active profile — defaults to 'dev' locally (spring-dotenv loads .env), 'prod' in Docker
# (Dockerfile bakes ENV SPRING_PROFILES_ACTIVE=prod; Render overrides via env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port — Render injects PORT automatically; fallback to 8080 for local dev
server.port=${PORT:8080}

# Datasource — all values injected via environment variables; never hardcoded
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Explicit dialect — prevents Hibernate 7.x from needing a live DB connection at
# startup just to auto-detect the dialect. Without this, a transient DB connection
# failure (e.g. Supabase max-clients) causes a cascade: "Unable to determine Dialect".
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP — base safety limits applied to ALL profiles.
# Supabase Session-mode pooler (port 5432) caps total connections at 15 on free tier.
# These limits prevent exhausting that cap even if the wrong profile loads.
# Profile-specific overrides in application-prod.properties tighten this further.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Supabase JWT secret (for Supabase-issued JWT validation in JwtAuthFilter)
supabase.jwt.secret=${JWT_SECRET}

# Gemini API key
gemini.api.key=${GEMINI_API_KEY}

# FRONTEND_URL — used by CorsConfig to set the primary allowed CORS origin
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Actuator — expose only health and info; never expose env, beans, mappings, etc.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true