# =============================================
# Production Profile
# Activated by: SPRING_PROFILES_ACTIVE=prod
# =============================================

# SQL logging — disabled in production (never log queries or parameters)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# DDL — update schema automatically on startup (safe for Render deploys)
spring.jpa.hibernate.ddl-auto=update

# Logging levels — production-appropriate (warnings and errors only for most libs)
logging.level.root=WARN
logging.level.com.dwaragesh.insights=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# Actuator — no details exposed (status only: UP / DOWN)
management.endpoint.health.show-details=never

# Connection pool — tuned for Render's container environment
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
