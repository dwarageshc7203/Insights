# =============================================
# Production Profile
# Activated by: SPRING_PROFILES_ACTIVE=prod
# Default in Docker images (set via ENV in Dockerfile)
# =============================================

# SQL logging — disabled in production (never log queries or bind parameters)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dialect — explicit, matches application.properties; reinforced here to be safe
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL — update schema automatically on startup
spring.jpa.hibernate.ddl-auto=update

# Logging levels — production: quiet by default
logging.level.root=WARN
logging.level.com.dwaragesh.insights=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# Actuator — status only (UP/DOWN), no internal details exposed
management.endpoint.health.show-details=never

# HikariCP — tuned for Supabase Transaction Pooler (port 6543).
# Transaction mode allows many more simultaneous logical connections because
# physical server connections are reused between transactions.
# Keep pool small (3 max) since Render free/starter containers are single-instance
# and we don't need more than a few concurrent DB connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Supabase PgBouncer compatibility: disable prepared statements in transaction mode
spring.datasource.hikari.data-source-properties.prepareThreshold=0
